[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1pred"
version = "0.1.0"
description = "Probabilistic Formula 1 forecasts with chronological evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "requests>=2.32",
  "pyarrow>=16",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16", "build>=1.6"]
telemetry = ["fastf1>=3.6"]
boosting = ["xgboost>=3.0"]

[project.scripts]
f1pred = "f1pred.cli:main"

[tool.setuptools.packages.find]
include = ["f1pred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "results", "data", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
